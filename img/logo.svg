<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- macOS Squircle Clip -->
    <clipPath id="squircle">
      <rect x="82" y="82" width="860" height="860" rx="195" ry="195" />
    </clipPath>
    <!-- Split shading clip (left & right half of crab) -->
    <clipPath id="left-half">
      <rect x="0" y="0" width="512" height="1024" />
    </clipPath>
    <clipPath id="right-half">
      <rect x="512" y="0" width="512" height="1024" />
    </clipPath>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="82" y="82" width="860" height="860" rx="195" ry="195" fill="#2A364B" />

  <!-- Ground Shadow -->
  <ellipse cx="512" cy="798" rx="235" ry="20" fill="#1E2738" />

  <!-- ================= LEGS (3 pairs, faceted flat style) ================= -->
  <!-- Left Legs -->
  <g>
    <!-- Back Left Leg -->
    <polygon points="415,630 335,610 295,695 345,705" fill="#D94814" />
    <polygon points="335,610 295,695 280,775 315,705" fill="#A9320B" />
    <!-- Middle Left Leg -->
    <polygon points="390,595 290,575 235,685 285,695" fill="#E8561B" />
    <polygon points="290,575 235,685 215,765 265,685" fill="#B83B0E" />
    <!-- Front Left Leg -->
    <polygon points="370,560 250,550 185,655 240,665" fill="#F06022" />
    <polygon points="250,550 185,655 155,735 215,655" fill="#C44110" />
  </g>

  <!-- Right Legs -->
  <g>
    <!-- Back Right Leg -->
    <polygon points="609,630 689,610 729,695 679,705" fill="#C44110" />
    <polygon points="689,610 729,695 744,775 709,705" fill="#962B08" />
    <!-- Middle Right Leg -->
    <polygon points="634,595 734,575 789,685 739,695" fill="#D94814" />
    <polygon points="734,575 789,685 809,765 759,685" fill="#A9320B" />
    <!-- Front Right Leg -->
    <polygon points="654,560 774,550 839,655 784,665" fill="#E8561B" />
    <polygon points="774,550 839,655 869,735 809,655" fill="#B83B0E" />
  </g>

  <!-- ================= ARMS & CLAWS ================= -->
  <!-- Left Arm -->
  <path d="M 365,535 C 295,535 250,490 245,425 L 295,415 C 300,460 325,490 375,495 Z" fill="#E8561B" />
  <path d="M 365,535 C 310,535 270,505 255,460 L 295,450 C 305,478 330,492 375,495 Z" fill="#C44110" />

  <!-- Right Arm -->
  <path d="M 659,535 C 729,535 774,490 779,425 L 729,415 C 724,460 699,490 649,495 Z" fill="#D94814" />
  <path d="M 659,535 C 714,535 754,505 769,460 L 729,450 C 719,478 694,492 649,495 Z" fill="#A9320B" />

  <!-- ================= CREDIT CARD (held by left claw) ================= -->
  <g transform="translate(265, 295) rotate(-32)">
    <!-- Card Base -->
    <rect x="-140" y="-85" width="280" height="175" rx="18" fill="#CFD8E3" />
    <!-- Card Lighter Top Half -->
    <path d="M -122,-85 H 122 A 18,18 0 0 1 140,-67 V 10 H -140 V -67 A 18,18 0 0 1 -122,-85 Z" fill="#E4EBF2" />
    <!-- Magnetic Stripe -->
    <rect x="-140" y="-52" width="280" height="32" fill="#2A364B" />
    <!-- Signature / Text Lines -->
    <rect x="-112" y="18" width="95" height="12" rx="6" fill="#7D8B9E" />
    <rect x="-112" y="42" width="125" height="12" rx="6" fill="#7D8B9E" />
    <!-- Mastercard-style Circles -->
    <circle cx="68" cy="30" r="22" fill="#7D8B9E" />
    <circle cx="94" cy="30" r="22" fill="#96A3B5" />
  </g>

  <!-- Left Claw (Front of Card) -->
  <path d="M 192,405 C 185,465 235,500 285,485 C 330,472 340,420 305,360 C 292,390 272,408 250,408 C 232,408 215,392 192,405 Z" fill="#F06022" />
  <path d="M 198,425 C 205,470 245,495 285,485 C 318,476 332,440 318,395 C 295,435 245,445 198,425 Z" fill="#D94814" />

  <!-- ================= GOLD COIN (held by right claw) ================= -->
  <!--Right Claw Back Pincer -->
  <path d="M 730,455 C 690,430 688,365 725,330 C 735,365 745,395 765,415 Z" fill="#B83B0E" />

  <!-- Gold Coin -->
  <g transform="translate(742, 308)">
    <circle cx="0" cy="0" r="82" fill="#E0A526" />
    <circle cx="0" cy="0" r="76" fill="#F7C948" />
    <circle cx="0" cy="0" r="58" fill="#E5AC2B" />
    <!-- Coin Diagonal Shine -->
    <polygon points="-35,-46 -5,-58 38,42 8,54" fill="#F7C948" opacity="0.65" />
  </g>

  <!-- Right Claw Front Pincer (overlapping coin) -->
  <path d="M 702,445 C 722,495 782,498 815,455 C 848,412 835,335 778,285 C 765,330 765,375 745,402 C 730,418 712,425 702,445 Z" fill="#F06022" />
  <path d="M 702,445 C 722,495 782,498 815,455 C 836,426 836,380 815,335 C 805,395 765,445 702,445 Z" fill="#D94814" />
  <!-- Right Claw Gloss Highlights -->
  <ellipse cx="806" cy="392" rx="7" ry="18" transform="rotate(12 806 392)" fill="#FF945B" opacity="0.8" />
  <circle cx="800" cy="424" r="5.5" fill="#FF945B" opacity="0.8" />

  <!-- ================= CRAB EYE STALKS & EYES ================= -->
  <!-- Eyebrows (Happy / Friendly Arches) -->
  <path d="M 398,358 Q 422,340 448,352" fill="none" stroke="#E8561B" stroke-width="12" stroke-linecap="round" />
  <path d="M 576,352 Q 602,340 626,358" fill="none" stroke="#D94814" stroke-width="12" stroke-linecap="round" />

  <!-- Left Eye Stalk & Eye -->
  <rect x="438" y="425" width="24" height="45" rx="8" fill="#D94814" />
  <circle cx="448" cy="402" r="44" fill="#F06022" />
  <circle cx="448" cy="402" r="31" fill="#FFFFFF" />
  <circle cx="448" cy="402" r="19" fill="#1E2738" />
  <!-- Left Eye Catchlight (looking slightly up-left) -->
  <circle cx="438" cy="394" r="7.5" fill="#FFFFFF" />

  <!-- Right Eye Stalk & Eye -->
  <rect x="562" y="425" width="24" height="45" rx="8" fill="#B83B0E" />
  <circle cx="576" cy="402" r="44" fill="#D94814" />
  <circle cx="576" cy="402" r="31" fill="#FFFFFF" />
  <circle cx="576" cy="402" r="19" fill="#1E2738" />
  <!-- Right Eye Catchlight -->
  <circle cx="566" cy="394" r="7.5" fill="#FFFFFF" />

  <!-- ================= CRAB CARAPACE (BODY) ================= -->
  <!-- Left Half of Body (Brighter Orange) -->
  <g clip-path="url(#left-half)">
    <!-- Upper Shell Dome -->
    <path d="M 295,555 C 335,425 425,435 512,435 C 599,435 689,425 729,555 L 585,685 L 439,685 Z" fill="#F26724" />
    <!-- Lower Belly Facet -->
    <polygon points="295,555 512,515 729,555 585,685 439,685" fill="#E55419" />
  </g>

  <!-- Right Half of Body (Shaded Orange) -->
  <g clip-path="url(#right-half)">
    <!-- Upper Shell Dome -->
    <path d="M 295,555 C 335,425 425,435 512,435 C 599,435 689,425 729,555 L 585,685 L 439,685 Z" fill="#DF5118" />
    <!-- Lower Belly Facet -->
    <polygon points="295,555 512,515 729,555 585,685 439,685" fill="#C94110" />
  </g>

  <!-- Carapace Highlights & Cheek Gloss -->
  <ellipse cx="386" cy="502" rx="16" ry="5.5" transform="rotate(-28 386 502)" fill="#FF9A62" opacity="0.75" />
  <circle cx="408" cy="489" r="5" fill="#FF9A62" opacity="0.75" />
  <!-- Happy Cheek Dimples/Blush -->
  <ellipse cx="422" cy="530" rx="15" ry="8" transform="rotate(-10 422 530)" fill="#FF8B52" opacity="0.7" />
  <ellipse cx="602" cy="530" rx="15" ry="8" transform="rotate(10 602 530)" fill="#F06E36" opacity="0.7" />

  <!-- ================= HAPPY OPEN SMILE ================= -->
  <!-- Smile Corner Dimples -->
  <path d="M 432,548 Q 442,538 454,544" fill="none" stroke="#8C2507" stroke-width="6" stroke-linecap="round" />
  <path d="M 592,548 Q 582,538 570,544" fill="none" stroke="#8C2507" stroke-width="6" stroke-linecap="round" />

  <!-- Open Mouth Cavity -->
  <path d="M 444,545 Q 512,568 580,545 C 572,602 545,622 512,622 C 479,622 452,602 444,545 Z" fill="#6E1907" />

  <!-- Happy Tongue (clipped inside mouth) -->
  <clipPath id="mouth-clip">
    <path d="M 444,545 Q 512,568 580,545 C 572,602 545,622 512,622 C 479,622 452,602 444,545 Z" />
  </clipPath>
  <g clip-path="url(#mouth-clip)">
    <ellipse cx="512" cy="612" rx="46" ry="26" fill="#FF6E4A" />
    <ellipse cx="526" cy="612" rx="36" ry="22" fill="#E85635" />
  </g>

  <!-- Mouth Outline -->
  <path d="M 444,545 Q 512,568 580,545 C 572,602 545,622 512,622 C 479,622 452,602 444,545 Z" fill="none" stroke="#7A1C08" stroke-width="5" stroke-linejoin="round" />

  <!-- Chin Crease -->
  <path d="M 490,636 Q 512,645 534,636" fill="none" stroke="#962B08" stroke-width="5.5" stroke-linecap="round" />
</svg>